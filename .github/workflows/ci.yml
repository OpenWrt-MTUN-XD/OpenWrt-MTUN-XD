name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: 生成器单测
        working-directory: generator
        run: bun test tests/unit
      - name: shell 语法
        run: |
          sh -n install.sh
          sh -n package/usr/sbin/mtun-xd
          sh -n control/postinst
          sh -n control/prerm
          sh -n deploy/mihomo-haproxy.sh
          sh -n deploy/mihomo-kwrt-nginx.sh
          sh -n generator/deploy/generator.sh
          sh -n generator/deploy/mihomo-apply
          sh -n openwrt/files/mtun-xd-firstboot
      - name: 打包自检
        # 造一遍 ipk 再逐项验：control 字段、指纹文件名、menu.d 指向、执行位、
        # 目录条目、两次构建字节一致、install.sh 不再写死版本号 —— 全在 tests/test_package.py
        run: python3 tests/test_package.py

  build-ipk:
    name: 造 ipk
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py ipk
      - uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: luci-app-mtun-xd_*.ipk

  build-apk:
    name: 造 apk
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Alpine 容器里用 apk.static 造包
        # ⚠️ 必须 edge：3.22 还是 apk-tools 2.x，mkpkg 不认 `-o`；
        #    apk-tools 3 的包格式才是 OpenWrt 25.x 要的。
        run: |
          docker run --rm -v "$PWD":/w -w /w alpine:edge sh -c '
            apk add --no-cache python3 apk-tools-static >/dev/null &&
            SUITE_APK_LOCAL=1 \
            SUITE_APK_MKPKG="$(command -v apk.static || echo /sbin/apk.static)" \
            python3 build.py apk
          '
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: luci-app-mtun-xd-*.apk
