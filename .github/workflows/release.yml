name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 版本已经发过也重跑一次
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: 查版本
    # ⚠️ 发布流程自己会把 dist/ 提交回 main（bot push）—— 那次推送不能再触发一轮发布：
    #    它会在 Release 还没建好时就跑起来，看到「dist 已是这版、Release 还没有」，
    #    于是又打一遍包。人推的、手动 dispatch 的照常跑。
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ⚠️ 版本号只从 build.py 读一份（生成器 state.js 的写法变了也不会两边对不上）
          V=$(python3 build.py version)
          [ -n "$V" ] || { echo "✘ 读不到版本号"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # ⚠️ 「发过没有」要**两样都齐**才算：dist 已经是这版，且 Release 也在。
          #    只看 Release 的话：Release 建好了、dist 没提交成功（推送被拒/半路失败），
          #    之后再怎么推都判「发过」→ 永远补不回来（2026-10-26 审出来）。
          DIST=$(git show HEAD:dist/latest.txt 2>/dev/null | tr -d '\r\n')
          # 本地抢跑：dist 已是这版但 Release 还没建 → 禁止发布；force 例外
          if [ "${{ inputs.force }}" != "true" ] && [ "$DIST" = "v$V" ] && ! gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::dist 已是 v$V 但 Release 不存在（本地抢跑）。确需重建 Release，请 workflow_dispatch + force=true"
            exit 1
          fi
          DONE=0
          if [ "$DIST" = "v$V" ] && gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            DONE=1
          fi
          if [ "${{ inputs.force }}" != "true" ] && [ "$DONE" = 1 ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$V 已经发过（dist + Release 都在）→ 跳过"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "准备发布 v$V（dist=v${DIST:-无}）"
          fi

  test:
    name: 测试
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: 生成器单测
        working-directory: generator
        run: bun test tests/unit
      - name: shell 语法
        run: |
          # 走统一脚本：15 个 shell 全覆盖（以后加文件不用改 CI）
          sh tools/check-shell.sh
          # 发出去的四个前端文件必须能过语法检查
          node --check package/www/luci-static/resources/mtun-xd/common.js
          node --check package/www/luci-static/resources/view/mtun-xd/panel.js
          node --check package/www/luci-static/resources/view/mtun-xd/generator.js
          node --check package/www/luci-static/resources/view/mtun-xd/upgrade.js
          node tools/check-yaml-tokens.mjs
          node tools/check-copy-integrity.mjs
      - name: 打包自检
        # 发版前先造一遍 ipk 逐项验（见 tests/test_package.py）—— 包坏了别等用户装的时候才发现
        run: python3 tests/test_package.py

  build-ipk:
    name: 造 ipk
    needs: [prepare, test]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py ipk
      - uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: luci-app-mtun-xd_*.ipk

  build-apk:
    name: 造 apk
    needs: [prepare, test]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Alpine edge 容器里用 apk.static 造包
        run: |
          docker run --rm -v "$PWD":/w -w /w alpine:edge sh -c '
            apk add --no-cache python3 apk-tools-static >/dev/null &&
            SUITE_APK_LOCAL=1 \
            SUITE_APK_MKPKG="$(command -v apk.static || echo /sbin/apk.static)" \
            python3 build.py apk
          '
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: luci-app-mtun-xd-*.apk

  published_check:
    name: 已发布检查
    needs: [prepare]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.chk.outputs.skip }}
    steps:
      - id: chk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION 已有 tag，按已发布处理"
            ASSETS=$(gh api "repos/${{ github.repository }}/releases/tags/v$VERSION" --jq '[.assets[] | select(.name | test("\\.(ipk|apk)$"))] | length' 2>/dev/null || echo 0)
            if [ "$ASSETS" -lt 2 ]; then
              echo "::error::tag v$VERSION 存在，但 Release 或 ipk/apk 附件不齐（assets=$ASSETS），属半截状态，需人工补 Release"
              exit 1
            fi
            echo "附件 $ASSETS 件齐全"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "v$VERSION 尚未发布"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: 发布
    needs: [prepare, test, build-ipk, build-apk, published_check]
    if: needs.prepare.outputs.release == 'true' && needs.published_check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/download-artifact@v4
        with:
          name: ipk
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: .

      - name: 出配置工具 kit（并发 genkit）
        working-directory: generator
        env:
          # GENKIT_TOKEN 只对 genkit 仓库有 Contents 写权限 —— 默认 GITHUB_TOKEN 写不了别的仓库。
          GH_TOKEN: ${{ secrets.GENKIT_TOKEN }}
          KIT_PUBLISH: '1'
        run: |
          # kit 必须由 CI 一次生成、同时落到 genkit 与 dist/：
          #   · tar.gz 字节依赖 zlib 版本，本地与 CI 打出来的不同 ⇒ 只能同批同源；
          #   · 套件的「工具升级」拿 CF 文件对 genkit 摘要，两边必须是同一批字节。
          bun scripts/make-router-kit.mjs /tmp/mihomo-deploy

      # ⚠️ 顺序：**先提交 dist、再建 Release**。
      #    反过来的话，Release 建好了、提交被拒（non-fast-forward / 临时网络）⇒
      #    线上还是旧包，而后面每次跑都判「发过」直接跳过（2026-10-26 审出来）。
      - name: kit 拷进 dist
        run: python3 build.py kit /tmp/mihomo-deploy

      - name: 更新 dist / SHA256SUMS
        run: python3 build.py dist

      - name: 校验 dist 配置工具包与源码同步
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 tools/check-kit-dist.py /tmp/mihomo-deploy dist "v$VERSION"

      - name: 同源闸门（dist ↔ genkit）
        # 不一致就别提交、别建 Release：宁可这版红着，也不要让用户点「工具升级」拿不到包。
        env:
          # 匿名调 GitHub API 只有 60 次/小时，runner 共享 IP 会 403；带上 token 才稳。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh tools/check-kit-sync.sh

      - name: 提交 dist 和 install.sh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist install.sh
          if git diff --cached --quiet; then
            echo "dist 没变化"
          else
            git commit -m "dist: v$VERSION"
            git push
          fi

      - name: 建 GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 build.py release

      - name: 强制重跑对账
        if: inputs.force == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          CF_BASE="https://mtun-xd.wxcircle.top"
          echo "## 人工强制重跑" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          BODY=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          EXPECTED_BODY=$(python3 -c 'import build,glob; print(build.release_body(sorted(glob.glob("luci-app-mtun-xd*"))),end="")')
          # 统一 LF 并 rstrip 尾随空白后再比；GitHub 回读可能丢尾随换行
          BODY_NORM=$(printf '%s' "$BODY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","\n").rstrip(),end="")')
          EXPECTED_NORM=$(printf '%s' "$EXPECTED_BODY" | python3 -c 'import sys; print(sys.stdin.read().replace("\r\n","\n").replace("\r","\n").rstrip(),end="")')
          BODY_SHA=$(printf '%s' "$BODY_NORM" | sha256sum | awk '{print $1}')
          EXPECTED_SHA=$(printf '%s' "$EXPECTED_NORM" | sha256sum | awk '{print $1}')
          ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | LC_ALL=C sort)
          EXPECTED_ASSETS=$(ls luci-app-mtun-xd-*.apk luci-app-mtun-xd_*.ipk | LC_ALL=C sort)
          ASSET_COUNT=$(printf '%s\n' "$ASSETS" | sed '/^$/d' | wc -l | tr -d ' ')
          if [ "$BODY_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::强制重跑正文 sha 不一致：release=$BODY_SHA expected=$EXPECTED_SHA"
            echo "::group::release body first 5 lines"
            printf '%s\n' "$BODY_NORM" | head -n 5
            echo "::endgroup::"
            echo "::group::expected body first 5 lines"
            printf '%s\n' "$EXPECTED_NORM" | head -n 5
            echo "::endgroup::"
            exit 1
          fi
          if [ "$ASSETS" != "$EXPECTED_ASSETS" ]; then
            echo "::error::强制重跑附件列表不一致"
            printf 'release:\n%s\nexpected:\n%s\n' "$ASSETS" "$EXPECTED_ASSETS"
            exit 1
          fi
          CF_LATEST=""
          CF_SUM=""
          LOCAL_SUM=$(cat dist/SHA256SUMS)
          for i in $(seq 1 18); do
            CF_LATEST=$(curl -fsSL --max-time 20 "$CF_BASE/latest.txt" || true)
            CF_SUM=$(curl -fsSL --max-time 20 "$CF_BASE/SHA256SUMS" || true)
            if [ "$CF_LATEST" = "v$VERSION" ] && [ "$CF_SUM" = "$LOCAL_SUM" ]; then
              break
            fi
            sleep 10
          done
          if [ "$CF_LATEST" != "v$VERSION" ]; then
            echo "::error::CF latest.txt 不一致：$CF_LATEST"
            exit 1
          fi
          if [ "$CF_SUM" != "$LOCAL_SUM" ]; then
            echo "::error::CF SHA256SUMS 与 dist 不一致"
            exit 1
          fi
          echo "- 正文 sha256: \`$BODY_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 附件数量: \`$ASSET_COUNT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- CF latest.txt: \`$CF_LATEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- CF SHA256SUMS 与 dist: 一致" >> "$GITHUB_STEP_SUMMARY"
          echo "强制重跑对账通过"

      - name: 通知 Telegram 群
        # 通知失败不拖红发版，但不许静默：缺 secret / HTTP / ok / message_id 都要告警
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${TG_TOKEN:-}" ] || missing="${missing} TELEGRAM_BOT_TOKEN"
          [ -n "${TG_CHAT:-}" ] || missing="${missing} TELEGRAM_CHAT_ID"
          if [ -n "$missing" ]; then
            echo "::warning::未配置 Actions secrets:${missing}，跳过 Telegram 通知"
            exit 0
          fi

          TAG="v${VERSION}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

          # 取本版更新内容：优先 Release 正文里的「更新内容」段，退回 CHANGELOG
          BODY=$(gh release view "$TAG" --json body -q .body 2>/dev/null || true)
          CHANGES=$(printf '%s\n' "$BODY" | sed -n '/^## 📣 更新内容/,/^## [^#]/p' | sed '1d;$d')
          if [ -z "$CHANGES" ]; then
            CHANGES=$(awk -v ver="$VERSION" '$0 ~ "^## "ver {f=1;next} /^## /{if(f)exit} f' CHANGELOG.md)
          fi
          # 纯文本化 + HTML 转义：先转义，再把 ### 小标题换成加粗（组间留空行）
          CHANGES=$(printf '%s\n' "$CHANGES" | sed -e 's/^- /• /' -e 's/`//g' -e '/^[[:space:]]*$/d')
          CHANGES=$(printf '%s' "$CHANGES" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')
          CHANGES=$(printf '%s\n' "$CHANGES" | awk '
            /^###* / {
              h = $0; sub(/^###* /, "", h);
              if (seen) print "";
              print "<b>" h "</b>"; seen = 1; next
            }
            { print; seen = 1 }
          ')
          CHANGES=$(printf '%s' "$CHANGES" | head -c 2500)

          MSG=$(printf '<b>🚀 墨枢云境 MTUN-XD %s 正式发布</b>\n\n%s\n\n<b>📋 更新内容</b>\n\n%s\n\n<b>🔗 更新详情</b>\n%s' \
            "$TAG" \
            "Mihomo 管理套件，专注于稳定性、可靠性与操作可控性。" \
            "$CHANGES" \
            "$URL")

          # Telegram 上限 4096，留余量
          MSG=$(printf '%s' "$MSG" | head -c 3800)

          RESP="$(mktemp)"
          trap 'rm -f "$RESP"' EXIT
          set +e
          HTTP=$(curl -sS --fail-with-body -m 30 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MSG}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=false" \
            -o "$RESP" -w '%{http_code}')
          CURL_RC=$?
          set -e
          cat "$RESP" 2>/dev/null || true
          OK=$(jq -r '.ok // false' "$RESP" 2>/dev/null || echo false)
          MID=$(jq -r '.result.message_id // empty' "$RESP" 2>/dev/null || true)
          ERR_CODE=$(jq -r '.error_code // empty' "$RESP" 2>/dev/null || true)
          ERR_DESC=$(jq -r '.description // empty' "$RESP" 2>/dev/null || true)
          if [ "$CURL_RC" -ne 0 ] || [ "$OK" != "true" ] || [ -z "$MID" ]; then
            echo "::error::Telegram 发送失败 HTTP=${HTTP:-?} curl=${CURL_RC} ok=${OK:-?} error_code=${ERR_CODE:-?} description=${ERR_DESC:-?}"
            exit 1
          fi
          echo "Telegram 通知成功 message_id=$MID"
