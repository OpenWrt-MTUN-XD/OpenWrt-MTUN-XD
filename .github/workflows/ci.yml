name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: 生成器单测
        working-directory: generator
        run: bun test tests/unit
      - name: 生成 kit（闸门对照）
        working-directory: generator
        env:
          KIT_NO_PUBLISH: '1'
        run: bun scripts/make-router-kit.mjs /tmp/mihomo-deploy
      - name: 校验 dist kit 与源码同步
        run: |
          VERSION="v$(python3 build.py version)"
          if [ "$(cat dist/latest.txt)" != "$VERSION" ]; then
            echo "版本刚 bump 到 $VERSION，dist 由 Release workflow 更新；跳过 dist kit 闸门"
            exit 0
          fi
          python3 tools/check-kit-dist.py /tmp/mihomo-deploy dist "$VERSION"
      - name: shell 语法
        run: |
          # 走统一脚本：15 个 shell 全覆盖（以后加文件不用改 CI）
          # -S error 是硬门禁；warning（如 SC3043 local）只打印，不阻塞
          sh tools/check-shell.sh
          # 发出去的四个前端文件必须能过语法检查
          node --check package/www/luci-static/resources/mtun-xd/common.js
          node --check package/www/luci-static/resources/view/mtun-xd/panel.js
          node --check package/www/luci-static/resources/view/mtun-xd/generator.js
          node --check package/www/luci-static/resources/view/mtun-xd/upgrade.js
          node tools/check-yaml-tokens.mjs
          node tools/check-copy-integrity.mjs
      - name: 打包自检
        # 造一遍 ipk 再逐项验：control 字段、指纹文件名、menu.d 指向、执行位、
        # 目录条目、两次构建字节一致、install.sh 不再写死版本号 —— 全在 tests/test_package.py
        run: python3 tests/test_package.py

  build-ipk:
    name: 造 ipk
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py ipk
      - uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: luci-app-mtun-xd_*.ipk

  build-apk:
    name: 造 apk
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Alpine 容器里用 apk.static 造包
        # ⚠️ 必须 edge：3.22 还是 apk-tools 2.x，mkpkg 不认 `-o`；
        #    apk-tools 3 的包格式才是 OpenWrt 25.x 要的。
        run: |
          docker run --rm -v "$PWD":/w -w /w alpine:edge sh -c '
            apk add --no-cache python3 apk-tools-static >/dev/null &&
            SUITE_APK_LOCAL=1 \
            SUITE_APK_MKPKG="$(command -v apk.static || echo /sbin/apk.static)" \
            python3 build.py apk
          '
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: luci-app-mtun-xd-*.apk
