name: 功能建议
description: 希望增加或改进的能力
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        本项目优先保证「安装/升级可靠 + 不破坏现有配置」，功能建议请说明实际使用场景，
        而不是只描述界面长什么样 —— 场景比方案更能说明问题。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的实际问题
      description: 现在是怎么做的？哪里别扭/慢/容易错？
      placeholder: 每次换节点都要手动改 config.yaml 里的……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的结果
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - 安装 / 升级 / 卸载
        - 配置生成器（节点导入 / 内网控制 / 规则）
        - 控制面板
        - 维护中心
        - 命令行（mtun-xd）
        - 文档
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 可选
